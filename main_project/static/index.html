<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIEM Simulator - Main Dashboard</title>
    <link rel="stylesheet" href="/static/styles.css?v=4">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="dashboard">
        <header class="header">
            <div class="logo">
                SIEM Simulator - Main Dashboard
            </div>
            <div class="status">
                <button id="theme-toggle-btn" class="btn btn-outline"
                    style="padding: 0.25rem 0.5rem; font-size: 0.7rem;">Toggle Theme</button>
                <button id="clear-db-btn" class="btn"
                    style="margin-right: 1rem; background-color: #ef4444; color: white; border: 1px solid white; padding: 0.25rem 0.5rem; font-size: 0.7rem;">Clear DB</button>
                <span class="indicator live"></span> Live Feed Active
            </div>
        </header>

        <div class="main-content">
            <section class="panel alerts-panel">
                <div class="panel-header">
                    <h2>Active Alerts</h2>
                    <span class="badge" id="alert-count">0</span>
                </div>
                <div class="alerts-container" id="alerts-list">
                    <div class="empty-state">No active alerts...</div>
                </div>
            </section>

            <section class="panel chart-panel">
                <div class="panel-header">
                    <h2>Events Over Time</h2>
                </div>
                <div class="chart-container">
                    <canvas id="eventsChart"></canvas>
                </div>
            </section>

            <section class="panel logs-panel">
                <div class="panel-header">
                    <h2>Recent Logs <span class="badge" id="log-count">0</span></h2>
                    <div class="filters">
                        <select id="filter-type">
                            <option value="">All Types</option>
                            <option value="failed_login">Failed Logins</option>
                            <option value="error">Errors</option>
                            <option value="successful_login">Success Logins</option>
                        </select>
                    </div>
                </div>
                <div class="table-container">
                    <table class="logs-table">
                        <thead>
                            <tr>
                                <th>Timestamp</th>
                                <th>Host</th>
                                <th>Source IP</th>
                                <th>Dest IP</th>
                                <th>Event Type</th>
                                <th>Message</th>
                            </tr>
                        </thead>
                        <tbody id="logs-body"></tbody>
                    </table>
                </div>
            </section>
        </div>
    </div>

    <div id="clear-db-modal" class="modal-overlay hidden">
        <div class="modal" style="max-width: 400px;">
            <div class="modal-header">
                <h2>Clear Database</h2>
            </div>
            <div class="modal-body">
                <p id="clear-db-message">Are you sure you want to completely clear the database? All logs and alerts
                    will be permanently deleted.</p>
                <div style="margin-top: 1.5rem; display: flex; justify-content: flex-end; gap: 0.5rem;"
                    id="clear-db-actions">
                    <button id="cancel-clear-btn" class="btn btn-outline">Cancel</button>
                    <button id="confirm-clear-btn" class="btn"
                        style="background-color: var(--danger); color: white;">Yes, Clear Database</button>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/main.js?v=4"></script>
</body>

</html>
